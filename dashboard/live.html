<section class="tabpanel" role="tabpanel" id="panel-live" aria-labelledby="tab-live" hidden>
  <div id="livebox" data-needs-token="__LIVE_NEEDS_TOKEN__">
    <h2 class="page-title">Live scenarios</h2>
    <p class="description">Submit a synthetic order and watch it move through the same decision engine. Each scenario shows where it should end and why. Synthetic data only; nothing real is touched.</p>
    <form class="liveform" id="liveForm">
      <label>Amount (INR)
        <input type="number" id="liveAmount" min="10" max="100000" step="1" value="500" required />
      </label>
      <label>Scenario
        <select id="liveScenario"></select>
      </label>
      <label>Orders
        <input type="number" id="liveCount" min="1" max="10" value="1" required />
      </label>
      <label id="liveTokenWrap" hidden>Write token
        <input type="password" id="liveToken" autocomplete="off" />
      </label>
      <button type="submit" class="btn primary" id="liveGo">Submit</button>
    </form>
    <p class="scenario-why" id="liveWhy"></p>
    <div class="livemsg" id="liveMsg" role="status" aria-live="polite"></div>
    <div class="tablewrap" style="margin-top:16px">
      <table class="grid">
        <caption class="sr-only">Recent live orders and where they ended</caption>
        <thead><tr><th scope="col">Order</th><th scope="col">Scenario</th><th scope="col">Outcome</th><th scope="col">Why it ended there</th></tr></thead>
        <tbody id="liveRows"></tbody>
      </table>
    </div>
  </div>
</section>
