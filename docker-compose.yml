name: verisync

# Phase 1 infra only: Redpanda (Kafka API), Redis, Postgres, plus Redpanda
# Console for eyeballing topics. No application services yet.
#
# Host-facing endpoints once this is up:
#   Kafka (host apps)      localhost:19092        <- note: 19092, not 9092
#   Kafka (in-network)     redpanda:9092
#   Redpanda Admin API     localhost:9644
#   Schema Registry        localhost:18081
#   Redpanda Console (web) http://localhost:8080
#   Postgres              localhost:15432  (verisync / verisync / verisync)
#   Redis                 localhost:16379  (host 16379 -> container 6379)
#
# Dev credentials are inlined on purpose so `docker compose up` just works for
# the Phase 1 checkpoint. Real secrets arrive with .env in Phase 3.

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: verisync-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"   # Kafka API (host)
      - "9644:9644"     # Admin API
      - "18081:18081"   # Schema Registry
      - "18082:18082"   # HTTP Proxy
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:\\s+true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: verisync-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "8080:8080"

  redis:
    image: redis:7.4-alpine
    container_name: verisync-redis
    # appendfsync everysec: 1-second durability guarantee for the Phase 4
    # delay-queue. no-appendfsync-on-rewrite yes: don't let a background AOF
    # rewrite block writes with disk I/O on a resource-constrained laptop disk.
    command: redis-server --appendonly yes --appendfsync everysec --no-appendfsync-on-rewrite yes
    ports:
      - "16379:6379"  # host 16379 -> container 6379 (6379 is often taken by another local redis)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16-alpine
    container_name: verisync-postgres
    environment:
      POSTGRES_USER: verisync
      POSTGRES_PASSWORD: verisync
      POSTGRES_DB: verisync
    ports:
      - "15432:5432"  # host 15432 -> container 5432 (5432/5433 sit in a Windows-excluded port range)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Applied once, on first init of an empty data volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verisync -d verisync"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  redpanda_data:
  redis_data:
  postgres_data:
