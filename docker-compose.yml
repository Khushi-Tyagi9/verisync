name: verisync

# Infra (Redpanda, Redis, Postgres, Redpanda Console) plus the application
# services (ingestion, worker, recheck, sweep, merchant-sim, dashboard), all
# built from the one Dockerfile at the repo root.
#
# Host-facing endpoints once this is up:
#   Ingestion webhook      http://localhost:8000/webhooks/razorpay
#   Dashboard              http://localhost:8050
#   Kafka (host apps)      localhost:19092        <- note: 19092, not 9092
#   Kafka (in-network)     redpanda:9092
#   Redpanda Admin API     localhost:9644
#   Schema Registry        localhost:18081
#   Redpanda Console (web) http://localhost:8080
#   Postgres              localhost:15432  (verisync / verisync / verisync)
#   Redis                 localhost:16379  (host 16379 -> container 6379)
#
# Application containers talk to the infra by in-network hostname and the
# container ports (redpanda:9092, postgres:5432, redis:6379), never the host
# ports above. Dev credentials are inlined on purpose so `docker compose up`
# just works; RAZORPAY_WEBHOOK_SECRET can be overridden from the shell or .env.

x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  LIFECYCLE_TOPIC: order-lifecycle-events
  POSTGRES_DSN: postgresql://verisync:verisync@postgres:5432/verisync
  REDIS_URL: redis://redis:6379/0
  # Timing knobs, overridable from the shell so scripts/run_batch.py can finish
  # in minutes instead of ~30. Defaults match worker/config.py and
  # merchant_sim/config.py.
  WORKER_RECHECK_DELAY_SECONDS: ${WORKER_RECHECK_DELAY_SECONDS:-600}
  WORKER_SWEEP_INTERVAL_SECONDS: ${WORKER_SWEEP_INTERVAL_SECONDS:-180}
  MERCHANT_SIM_LAG_SECONDS: ${MERCHANT_SIM_LAG_SECONDS:-900}

x-app: &app
  build: .
  image: verisync-app
  restart: unless-stopped
  environment:
    <<: *app-env

# Worker-style services have no HTTP port, so liveness is "PID 1 is still the
# python module we started".
x-worker-health: &worker-health
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: verisync-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"   # Kafka API (host)
      - "9644:9644"     # Admin API
      - "18081:18081"   # Schema Registry
      - "18082:18082"   # HTTP Proxy
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:\\s+true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: verisync-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "8080:8080"

  redis:
    image: redis:7.4-alpine
    container_name: verisync-redis
    # appendfsync everysec: 1-second durability guarantee for the Phase 4
    # delay-queue. no-appendfsync-on-rewrite yes: don't let a background AOF
    # rewrite block writes with disk I/O on a resource-constrained laptop disk.
    command: redis-server --appendonly yes --appendfsync everysec --no-appendfsync-on-rewrite yes
    ports:
      - "16379:6379"  # host 16379 -> container 6379 (6379 is often taken by another local redis)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:16-alpine
    container_name: verisync-postgres
    environment:
      POSTGRES_USER: verisync
      POSTGRES_PASSWORD: verisync
      POSTGRES_DB: verisync
    ports:
      - "15432:5432"  # host 15432 -> container 5432 (5432/5433 sit in a Windows-excluded port range)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Applied once, on first init of an empty data volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verisync -d verisync"]
      interval: 10s
      timeout: 3s
      retries: 12

  ingestion:
    <<: *app
    container_name: verisync-ingestion
    command: ["uvicorn", "--factory", "ingestion.webhook:create_app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-env
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-local_dev_webhook_secret}
    ports:
      - "8000:8000"
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    container_name: verisync-worker
    command: ["python", "-m", "worker.consumer"]
    depends_on:
      ingestion:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *worker-health
      test: ["CMD-SHELL", "grep -q worker.consumer /proc/1/cmdline"]

  recheck:
    <<: *app
    container_name: verisync-recheck
    command: ["python", "-m", "worker.recheck"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *worker-health
      test: ["CMD-SHELL", "grep -q worker.recheck /proc/1/cmdline"]

  sweep:
    <<: *app
    container_name: verisync-sweep
    command: ["python", "-m", "worker.sweep"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *worker-health
      test: ["CMD-SHELL", "grep -q worker.sweep /proc/1/cmdline"]

  merchant-sim:
    <<: *app
    container_name: verisync-merchant-sim
    command: ["python", "-m", "merchant_sim.simulator"]
    depends_on:
      ingestion:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *worker-health
      test: ["CMD-SHELL", "grep -q merchant_sim.simulator /proc/1/cmdline"]

  dashboard:
    <<: *app
    container_name: verisync-dashboard
    command: ["python", "-m", "dashboard.app"]
    environment:
      <<: *app-env
      DASHBOARD_HOST: 0.0.0.0
      # Off unless the shell / .env sets it; see POST /api/demo/orders.
      DASHBOARD_DEMO_MODE: ${DASHBOARD_DEMO_MODE:-false}
    ports:
      - "8050:8050"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  redpanda_data:
  redis_data:
  postgres_data:
