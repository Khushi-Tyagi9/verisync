[project]
name = "verisync"
version = "0.0.0"
description = "Real-time reconciliation between Razorpay payment status and a merchant's order record"
requires-python = ">=3.11"
# Same list as requirements.txt (tests/unit/test_manifests.py keeps them equal).
# Vercel may read either file; neither may name confluent-kafka or redis.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs the compose Postgres (skipped when unreachable)"]
